# 시세 모듈용 상주 sidecar (DHO Navigator 2.2.1+, ndjson-v1).
# 감지기(gamji)와 따로 빌드하려고 독립 workspace 로 둔다. 인식·캡처·주소 코드는 ../crates 를 그대로 쓴다.
[package]
name = "modside"
version = "0.16.1"
edition = "2024"
publish = false

[[bin]]
name = "price-side"
path = "src/main.rs"

[dependencies]
recog = { path = "../crates/recog" }
capture = { path = "../crates/capture" }
netaddr = { path = "../crates/netaddr" }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_Networking_WinHttp", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_ApplicationInstallationAndServicing", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_Shell"] }

[dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png", "webp"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.test]
opt-level = 3

[workspace]
